"2"/><text x="230" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">D3</text><circle cx="115" cy="95" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="230" y="190" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">20x25 yd. grid, target zones both ends. Coach feeds the attackers (A) — they turn</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">and pass to a target zone; defenders (D) try to intercept the pass.</text><g font-family="sans-serif" font-size="10" fill="#444"><rect x="12" y="223" width="14" height="8" fill="#F26522" opacity="0.35" stroke="#F26522" stroke-width="1"/><text x="34" y="234">Target zone</text><circle cx="118.4" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="133.4" y="234">Attacker</text><circle cx="201.60000000000002" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="216.60000000000002" y="234">Defender</text><line x1="277.8" y1="231" x2="295.8" y2="231" stroke="#F26522" stroke-width="2.5" marker-end="url(#sarr)"/><text x="301.8" y="234">Pass</text></g></svg>