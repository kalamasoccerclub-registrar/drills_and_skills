</defs><rect x="90" y="20" width="280" height="160" fill="#2F6B3A" stroke="#4C8C57" stroke-width="2"/><rect x="150" y="20" width="160" height="90" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 3"/><text x="230" y="15" text-anchor="middle" font-size="8" fill="#444" font-family="sans-serif">shooting zone</text><rect x="214" y="20" width="32" height="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><path d="M195,105 Q240,100 270,95" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#sarr)"/><path d="M220,70 Q245,75 260,85" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#darr)"/><circle cx="230" cy="35" r="9" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="230" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">GK</text><circle cx="220" cy="70" r="9" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="220" y="74" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">BG</text><circle cx="200" cy="100" r="10" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="200" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">A</text><circle cx="185" cy="113" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="230" y="200" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">Half field, 1 goal + GK, coned shooting zone. Each attacker (A) has a</text><text x="230" y="214" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">bodyguard (BG) who stays goal-side to block the shot, not tackle.</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="241" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="244">Attacker</text><circle cx="110.2" cy="241" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="125.2" y="244">