e="10" fill="#666" font-family="sans-serif">15x15 yd. grid, cone triangle in the center. 5v2 keep-away, but defenders (D)</text><text x="230" y="209" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">must also avoid the triangle — knocking it gives the attackers a bonus point.</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="234">Outer (5)</text><circle cx="115.6" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="130.6" y="234">Defender (2)</text><polygon points="220.4,224 214.31,234.5 226.49,234.5" fill="none" stroke="#F26522" stroke-width="2"/><text x="235.4" y="234">Protect zone</text></g></svg>