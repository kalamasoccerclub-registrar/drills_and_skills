<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Gladiators setup diagram</title><rect width="460" height="260" fill="#F7F7F7"/><defs>
