="middle" font-size="10" fill="#666" font-family="sans-serif">Small-sided field, one goal + GK, both teams numbered on the sideline. Coach</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">calls a number — those players enter live immediately (1v1, then 2v2...).</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="234">Waiting</text><circle cx="104.80000000000001" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="119.80000000000001" y="234">On field</text><line x1="181" y1="231" x2="199" y2="231" stroke="#F26522" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#sarr)"/><text x="205" y="234">Enter live</text></g></svg>