</defs><rect x="110" y="20" width="240" height="150" fill="#2F6B3A" stroke="#4C8C57" stroke-width="2"/><rect x="300" y="15" width="90" height="24" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="345" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#1A1A1A" font-family="sans-serif">"Turn!" / "Switch!"</text><path d="M158,58 Q195,45 222,38" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#sarr)"/><circle cx="150" cy="50" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="150" y="54" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="310" cy="50" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="310" y="54" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="150" cy="140" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="150" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="310" cy="140" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="310" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="230" cy="35" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="230" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="230" cy="155" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="230" y="159" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="200" cy="95" r="9" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="200" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">D</text><circle cx="260" cy="95" r="9" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="260" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">D</text><circle cx="150" cy="63" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="230" y="190" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">~10x10 yd. grid, 4-6 outer players vs. 2 defenders. Before receiving, the</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">passer calls what they will do — and must commit to it. No changing their mind.</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="234">Outer player</text><circle cx="131.8" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="146.8" y="234">Defender</text><line x1="208" y1="231" x2="226" y2="231" stroke="#F26522" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#sarr)"/><text x="232" y="234">Pass</text></g></svg>