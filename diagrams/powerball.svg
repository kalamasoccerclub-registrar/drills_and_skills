<marker id="darrw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker>
<marker id="sarr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F26522"/></marker>
</defs><rect x="60" y="20" width="340" height="150" fill="#2F6B3A" stroke="#4C8C57" stroke-width="2"/><circle cx="110" cy="50" r="8" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="2 2"/><circle cx="350" cy="50" r="8" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="2 2"/><circle cx="230" cy="95" r="8" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="2 2"/><circle cx="110" cy="140" r="8" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="2 2"/><circle cx="350" cy="140" r="8" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="2 2"/><text x="230" y="82" text-anchor="middle" font-size="7" fill="#e8e8e8" font-family="sans-serif">pot</text><path d="M175,88 Q200,60 225,52" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#sarr)"/><circle cx="170" cy="95" r="10" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">A</text><circle cx="200" cy="95" r="10" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="200" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">D</text><circle cx="158" cy="95" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="230" y="190" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">40x30 yd. grid, 5 cone "pots" scattered inside. Attacker (A) dribbles past the</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">defender (D, who tags — no tackling) and stops the ball inside an open pot.</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="230" r="6" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="2 2"/><text x="42" y="234">Pot (target)</text><circle cx="131.8" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="146.8" y="234">Attacker</text><circle cx="215" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="230" y="234">Defender (tag)</text></g></svg>