1A1A1A" stroke-width="1.5"/><text x="230" y="190" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">35x45 field, normal small-sided game. Coach freezes play calling "Up!" (just</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">won the ball) or "Down!" (just lost it) and asks what the team should do next.</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="234">Team A</text><circle cx="99.4" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="114.4" y="234">Team B</text></g></svg>