</defs><rect x="160" y="20" width="140" height="160" fill="#2F6B3A" stroke="#4C8C57" stroke-width="2"/><line x1="150" y1="10" x2="150" y2="190" stroke="#666" stroke-width="4"/><line x1="310" y1="10" x2="310" y2="190" stroke="#666" stroke-width="4"/><rect x="214" y="20" width="32" height="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><rect x="214" y="170" width="32" height="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><path d="M225,68 Q235,110 235,150" fill="none" stroke="#F26522" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#sarr)"/><circle cx="220" cy="60" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="220" y="64" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="240" cy="140" r="9" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="240" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="200" cy="100" r="9" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="200" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="260" cy="80" r="9" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="260" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif"></text><circle cx="220" cy="73" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="130" y="100" text-anchor="middle" font-size="8" fill="#999" font-family="sans-serif" transform="rotate(-90 130 100)">no wide play</text><text x="230" y="200" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">~20 yd. wide x 35 yd. long, goals both ends — no wide channels. All attacking</text><text x="230" y="214" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">and defending happens through the narrow central "tunnel."</text><g font-family="sans-serif" font-size="10" fill="#44