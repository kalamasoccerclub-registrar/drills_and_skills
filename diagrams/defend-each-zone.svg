2</text><circle cx="105" cy="128" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="230" y="190" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">25x35 yd. field split into thirds, goal each end. One defender (D) per zone</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">stays in that zone; attacking pairs (A) dribble/pass through to score.</text><g font-family="sans-serif" font-size="10" fill="#444"><rect x="12" y="221" width="16" height="9" fill="none" stroke="#1A1A1A" stroke-width="2"/><text x="34" y="234">Goal</text><circle cx="80.6" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="95.6" y="234">Defender (1/zone)</text><circle cx="212.4" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="227.4" y="234">Attacking pair</text><line x1="321" y1="231" x2="339" y2="231" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#darrw)"/><text x="345" y="234">Pass/dribble</text></g></svg>