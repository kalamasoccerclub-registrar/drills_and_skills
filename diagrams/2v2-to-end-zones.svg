</defs><rect x="60" y="20" width="340" height="150" fill="#2F6B3A" stroke="#4C8C57" stroke-width="2"/><rect x="60" y="20" width="45" height="150" fill="#3d7a48" stroke="#4C8C57" stroke-width="1"/><rect x="355" y="20" width="45" height="150" fill="#3d7a48" stroke="#4C8C57" stroke-width="1"/><text x="82" y="15" text-anchor="middle" font-size="9" fill="#444" font-family="sans-serif">End zone</text><text x="377" y="15" text-anchor="middle" font-size="9" fill="#444" font-family="sans-serif">End zone</text><path d="M170,75 Q260,55 350,45" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#darrw)"/><path d="M240,130 Q160,150 108,158" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#darr)"/><circle cx="160" cy="70" r="10" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="160" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="sans-serif">A1</text><circle cx="160" cy="130" r="10" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="160" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="sans-serif">A2</text><circle cx="250" cy="70" r="10" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="250" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="sans-serif">D1</text><circle cx="250" cy="130" r="10" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="250" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="sans-serif">D2</text><circle cx="160" cy="82" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="230" y="190" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">15x25 yd. field, 5-yd end zones each end. Attackers (A1/A2) dribble into the</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">far end zone to score; defenders (D1/D2) steal and dribble to the opposite zone.</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="234">Attacker</text><circle cx="110.2" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="125.2" y="234">Defender</text><line x1="186.4" y1="231" x2="204.4" y2="231" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#darrw)"/><text x="210.4" y="234">Attack run</text><line x1="282.4" y1="231" x2="300.4" y2="231" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#darr)"/><text x="306.4" y="234">Counter run</text></g></svg>