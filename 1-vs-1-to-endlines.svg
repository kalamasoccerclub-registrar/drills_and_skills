<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>1 vs 1 to Endlines setup diagram</title><rect width="460" height="260" fill="#F7F7F7"/><defs>
<marker id="darr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/></marker>
<marker id="darrw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker>
<marker id="sarr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F26522"/></marker>
</defs><rect x="140" y="20" width="180" height="150" fill="#2F6B3A" stroke="#4C8C57" stroke-width="2"/><line x1="140" y1="30" x2="320" y2="30" stroke="#FFFFFF" stroke-width="2"/><line x1="140" y1="160" x2="320" y2="160" stroke="#FFFFFF" stroke-width="2"/><path d="M230,132 Q245,105 230,45" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#darrw)"/><path d="M215,95 Q195,130 210,155" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#darr)"/><circle cx="230" cy="85" r="10" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="230" y="89" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">D</text><circle cx="230" cy="145" r="10" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="230" y="149" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="sans-serif">A</text><circle cx="230" cy="132" r="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/><text x="230" y="190" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">10x20 yd. channel, one ball per pair. Attacker (A) scores by dribbling across</text><text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">D’s end line; D scores by winning it and dribbling back across A’s line.</text><g font-family="sans-serif" font-size="10" fill="#444"><circle cx="27" cy="231" r="7" fill="#F26522" stroke="#FFFFFF" stroke-width="2"/><text x="42" y="234">Attacker</text><circle cx="110.2" cy="231" r="7" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/><text x="125.2" y="234">Defender</text><line x1="186.4" y1="231" x2="204.4" y2="231" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#darrw)"/><text x="210.4" y="234">Attack</text><line x1="260.8" y1="231" x2="278.8" y2="231" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#darr)"/><text x="284.8" y="234">Win &amp; return</text></g></svg>